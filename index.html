<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আল্ট্রা প্রো ম্যাক্স ফ্লাশলাইট</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow: hidden;
        }

        /* ১. ডিফল্ট অবস্থা: অফ (কালো স্ক্রিন) */
        body.state-off {
            background-color: #0d0e12;
            color: #ffffff;
        }

        /* ২. অন অবস্থা: সম্পূর্ণ স্ক্রিন উজ্জ্বল সাদা (ফুল ফ্লাশলাইট) */
        body.state-on {
            background-color: #ffffff !important;
            color: #111111;
        }

        .container {
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        /* লাইট অন থাকলে আইকন চমকাবে */
        .state-on .icon {
            animation: glow 1.2s infinite alternate;
        }

        @keyframes glow {
            from { transform: scale(1); filter: drop-shadow(0 0 15px #ffd600); }
            to { transform: scale(1.1); filter: drop-shadow(0 0 35px #ffab00); }
        }

        /* অন বাটন */
        .btn-toggle {
            padding: 16px 36px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-toggle:active {
            transform: scale(0.95);
        }

        .btn-turn-on {
            background: linear-gradient(135deg, #00e676, #00b0ff);
            color: #0d0e12;
            box-shadow: 0 8px 25px rgba(0, 230, 118, 0.4);
        }

        .btn-turn-off {
            background: linear-gradient(135deg, #ff1744, #d50000);
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(255, 23, 68, 0.4);
            display: none;
        }

        .tip-text {
            margin-top: 15px;
            font-size: 14px;
            opacity: 0.7;
        }

        /* সাবস্ক্রিপশন মডাল */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            z-index: 999;
            padding: 20px;
        }

        .modal-box {
            background: #ffffff;
            color: #222222;
            padding: 26px 22px;
            border-radius: 24px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            animation: popUp 0.25s ease-out;
        }

        @keyframes popUp {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-box h2 {
            font-size: 22px;
            color: #d32f2f;
            margin-bottom: 8px;
        }

        .modal-box p {
            font-size: 14px;
            color: #555;
            margin-bottom: 14px;
            line-height: 1.4;
        }

        /* বিকাশ/নগদ/উপায় ব্যাজ */
        .methods {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .badge {
            font-size: 12px;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 6px;
            color: white;
        }

        .bkash { background-color: #e2136e; }
        .nagad { background-color: #f7941d; }
        .upay  { background-color: #005a9c; }

        /* নম্বর বক্স */
        .number-box {
            background: #f8f9fa;
            border: 2px dashed #b0bec5;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .number-text {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #263238;
        }

        .copy-btn {
            background: #37474f;
            color: #fff;
            border: none;
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        .copy-btn:hover {
            background: #212121;
        }

        .trx-input {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            border: 1px solid #cfd8dc;
            border-radius: 10px;
            margin-bottom: 12px;
            text-align: center;
            outline: none;
        }

        .trx-input:focus {
            border-color: #00c853;
        }

        .btn-confirm {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: #00c853;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 8px;
            box-shadow: 0 4px 12px rgba(0, 200, 83, 0.3);
        }

        .btn-cancel {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            color: #78909c;
            background: transparent;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body class="state-off" id="screen">

    <div class="container">
        <div class="icon" id="lightIcon">🌑</div>
        
        <!-- ১. লাইট অন করার বাটন (ডিফল্ট দেখাবে) -->
        <button class="btn-toggle btn-turn-on" id="onBtn" onclick="turnOnLight()">লাইট অন করুন 🔦</button>

        <!-- ২. লাইট অফ করার বাটন (অন হওয়ার পর দেখাবে) -->
        <button class="btn-toggle btn-turn-off" id="offBtn" onclick="tryTurnOffLight()">লাইট অফ করুন 🛑</button>

        <p class="tip-text" id="statusText">স্ক্রিন বর্তমানে অন্ধকার। লাইট জ্বালাতে বাটনে চাপ দিন।</p>
    </div>

    <!-- পেমেন্ট পপ-আপ -->
    <div class="modal-overlay" id="payModal">
        <div class="modal-box">
            <h2>⚠️ প্রিমিয়াম ফিচার!</h2>
            <p>লাইট জ্বালানো ফ্রি, তবে <strong>অফ করতে</strong> নিচের নম্বরে <strong>১০ টাকা সেন্ড মানি</strong> করতে হবে!</p>

            <div class="methods">
                <span class="badge bkash">বিকাশ</span>
                <span class="badge nagad">নগদ</span>
                <span class="badge upay">উপায়</span>
            </div>

            <div class="number-box">
                <span class="number-text" id="phoneNum">01932084441</span>
                <button class="copy-btn" id="copyBtn" onclick="copyNumber()">কপি</button>
            </div>

            <input type="text" id="trxInput" class="trx-input" placeholder="TrxID বা আপনার নম্বর লিখুন">

            <button class="btn-confirm" id="confirmBtn" onclick="verifyAndTurnOff()">১০ টাকা পাঠিয়েছি, অফ করুন ⚡</button>
            <button class="btn-cancel" onclick="refusePayment()">টাকা দেব না, লাইট জ্বলতেই থাকুক 🥲</button>
        </div>
    </div>

    <script>
        const screen = document.getElementById('screen');
        const onBtn = document.getElementById('onBtn');
        const offBtn = document.getElementById('offBtn');
        const lightIcon = document.getElementById('lightIcon');
        const statusText = document.getElementById('statusText');
        const payModal = document.getElementById('payModal');
        const copyBtn = document.getElementById('copyBtn');
        const confirmBtn = document.getElementById('confirmBtn');

        // ১. লাইট অন করা (ফুল স্ক্রিন উজ্জ্বল সাদা)
        function turnOnLight() {
            // মোবাইলে ফুলস্ক্রিন করার চেষ্টা করবে যাতে ফুল ব্রাইটনেস পাওয়া যায়
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }

            screen.classList.remove('state-off');
            screen.classList.add('state-on');

            lightIcon.innerText = '💡';
            onBtn.style.display = 'none';
            offBtn.style.display = 'inline-block';
            statusText.innerText = 'ফ্লাশলাইট পূর্ণ শক্তিতে জ্বলছে! অফ করতে নিচের বাটনে চাপ দিন।';
        }

        // ২. অফ বাটনে ক্লিক করলে সাবস্ক্রিপশন চাওয়া
        function tryTurnOffLight() {
            payModal.style.display = 'flex';
        }

        // নম্বর কপি ফাংশন
        function copyNumber() {
            const num = document.getElementById('phoneNum').innerText;
            navigator.clipboard.writeText(num).then(() => {
                copyBtn.innerText = 'কপি হয়েছে!';
                copyBtn.style.background = '#00c853';
                setTimeout(() => {
                    copyBtn.innerText = 'কপি';
                    copyBtn.style.background = '#37474f';
                }, 2000);
            });
        }

        // টাকা দিতে অস্বীকার করলে লাইট অন-ই থাকবে
        function refusePayment() {
            payModal.style.display = 'none';
            alert('টাকা ছাড়া সেবা বন্ধ হবে না! লাইট জ্বলতেই থাকবে 🔥');
        }

        // ৩. পেমেন্ট ভেরিফাই করে লাইট অফ করা
        function verifyAndTurnOff() {
            confirmBtn.innerText = 'যাচাই করা হচ্ছে... ⏳';
            confirmBtn.disabled = true;

            setTimeout(() => {
                // পপ-আপ লুকানো
                payModal.style.display = 'none';
                confirmBtn.innerText = '১০ টাকা পাঠিয়েছি, অফ করুন ⚡';
                confirmBtn.disabled = false;

                // স্ক্রিন আবার ডার্ক করা
                screen.classList.remove('state-on');
                screen.classList.add('state-off');

                lightIcon.innerText = '🌑';
                offBtn.style.display = 'none';
                onBtn.style.display = 'inline-block';
                statusText.innerText = '১০ টাকা সফলভাবে গ্রহণ করা হয়েছে। লাইট অফ করা হয়েছে!';

                // ফুলস্ক্রিন থেকে বের হওয়া
                if (document.exitFullscreen && document.fullscreenElement) {
                    document.exitFullscreen().catch(() => {});
                }
            }, 1200);
        }
    </script>
</body>
</html>
