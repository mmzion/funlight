<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>স্ক্রিন ফ্লাশলাইট</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* পুরো স্ক্রিন জুড়ের লেআউট - ডিফল্ট পিচ ব্ল্যাক */
        #screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            transition: background-color 0.2s ease, color 0.2s ease;
            z-index: 1;
        }

        /* আইকন */
        #icon {
            font-size: 80px;
            margin-bottom: 25px;
            line-height: 1;
        }

        /* বাটন স্টাইল */
        .btn {
            font-size: 20px;
            font-weight: bold;
            padding: 16px 36px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            outline: none;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            transition: transform 0.15s ease;
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* ১. লাইট অন বাটন (সবুজ/নীল আভা) */
        #onBtn {
            display: inline-block;
            background: linear-gradient(135deg, #00e676, #00b0ff);
            color: #000000;
        }

        /* ২. লাইট অফ বাটন (লাল - ডিফল্ট হাইড থাকবে) */
        #offBtn {
            display: none;
            background: linear-gradient(135deg, #ff1744, #c62828);
            color: #ffffff;
        }

        #statusText {
            margin-top: 15px;
            font-size: 14px;
            opacity: 0.8;
        }

        /* --- পেমেন্ট মডাল (পপ-আপ) --- */
        #payModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .modal-card {
            background: #ffffff;
            color: #222222;
            padding: 25px 20px;
            border-radius: 20px;
            max-width: 350px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .modal-card h3 {
            color: #d32f2f;
            font-size: 20px;
            margin-bottom: 8px;
        }

        .modal-card p {
            font-size: 14px;
            color: #555555;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        /* ব্যাজ */
        .methods {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 12px;
        }

        .badge {
            font-size: 11px;
            font-weight: bold;
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 4px;
        }
        .bkash { background: #e2136e; }
        .nagad { background: #f7941d; }
        .upay  { background: #005a9c; }

        /* নম্বর বক্স */
        .num-box {
            background: #f4f6f8;
            border: 2px dashed #90a4ae;
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .num-box span {
            font-size: 17px;
            font-weight: bold;
            color: #263238;
            letter-spacing: 1px;
        }

        .num-box button {
            background: #37474f;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-confirm {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background: #00c853;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .btn-refuse {
            background: none;
            border: none;
            color: #78909c;
            font-size: 13px;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- মূল স্ক্রিন -->
    <div id="screen">
        <div id="icon">🌑</div>
        
        <!-- ১. লাইট অন বাটন (ডিফল্ট দেখাবে) -->
        <button id="onBtn" class="btn" onclick="turnOnFlashlight()">লাইট অন করুন 🔦</button>
        
        <!-- ২. লাইট অফ বাটন (অন হওয়ার পর আসবে) -->
        <button id="offBtn" class="btn" onclick="openPaymentModal()">লাইট অফ করুন 🛑</button>

        <p id="statusText">স্ক্রিন বর্তমানে অফ আছে</p>
    </div>

    <!-- পেমেন্ট পপ-আপ -->
    <div id="payModal">
        <div class="modal-card">
            <h3>⚠️ সাবস্ক্রিপশন প্রয়োজন!</h3>
            <p>লাইট জ্বালানো ফ্রি ছিল, কিন্তু <strong>অফ করতে</strong> নিচের নম্বরে <strong>১০ টাকা সেন্ড মানি</strong> করুন:</p>

            <div class="methods">
                <span class="badge bkash">বিকাশ</span>
                <span class="badge nagad">নগদ</span>
                <span class="badge upay">উপায়</span>
            </div>

            <div class="num-box">
                <span id="phoneNum">01932084441</span>
                <button id="copyBtn" onclick="copyNumber()">কপি</button>
            </div>

            <button class="btn-confirm" id="confirmBtn" onclick="confirmPaymentAndTurnOff()">১০ টাকা পাঠিয়েছি, অফ করুন ⚡</button>
            <button class="btn-refuse" onclick="refusePayment()">টাকা দেব না (লাইট জ্বলতেই থাকুক)</button>
        </div>
    </div>

    <script>
        const screen = document.getElementById('screen');
        const icon = document.getElementById('icon');
        const onBtn = document.getElementById('onBtn');
        const offBtn = document.getElementById('offBtn');
        const statusText = document.getElementById('statusText');
        const payModal = document.getElementById('payModal');
        const copyBtn = document.getElementById('copyBtn');
        const confirmBtn = document.getElementById('confirmBtn');

        let wakeLock = null;

        // ১. লাইট অন করা ফাংশন
        function turnOnFlashlight() {
            // (ক) তাৎক্ষণিক ব্যাকগ্রাউন্ড ১০০% সাদা ও টেক্সট ডার্ক করা
            screen.style.backgroundColor = '#ffffff';
            screen.style.color = '#000000';
            icon.innerText = '💡';
            statusText.innerText = 'ফ্লাশলাইট পূর্ণ শক্তিতে জ্বলছে!';

            // (খ) বাটন বদলে লাল "লাইট অফ" বাটন করা
            onBtn.style.display = 'none';
            offBtn.style.display = 'inline-block';

            // (গ) ফুলস্ক্রিন করার চেষ্টা করা (যাতে ব্রাউজার বার ঢেকে সর্বোচ্চ আলো দেয়)
            try {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(() => {});
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                }
            } catch (e) {}

            // (ঘ) মোবাইল স্ক্রিন যাতে নিভে না যায় (WakeLock)
            if ('wakeLock' in navigator) {
                navigator.wakeLock.request('screen').then(lock => {
                    wakeLock = lock;
                }).catch(() => {});
            }
        }

        // ২. লাইট অফ করতে গেলে মডাল পপ-আপ খোলা
        function openPaymentModal() {
            payModal.style.display = 'flex';
        }

        // ৩. নম্বর কপি করা
        function copyNumber() {
            const num = document.getElementById('phoneNum').innerText;
            navigator.clipboard.writeText(num).then(() => {
                copyBtn.innerText = 'কপি হয়েছে!';
                copyBtn.style.background = '#00c853';
                setTimeout(() => {
                    copyBtn.innerText = 'কপি';
                    copyBtn.style.background = '#37474f';
                }, 2000);
            });
        }

        // টাকা না দিলে লাইট অফ হবে না
        function refusePayment() {
            payModal.style.display = 'none';
            alert('টাকা ছাড়া লাইট অফ হবে না! লাইট জ্বলতেই থাকবে 🔥');
        }

        // ৪. টাকা দিলে অফ হওয়া
        function confirmPaymentAndTurnOff() {
            confirmBtn.innerText = 'যাচাই করা হচ্ছে...';
            confirmBtn.disabled = true;

            setTimeout(() => {
                // পপ-আপ বন্ধ
                payModal.style.display = 'none';
                confirmBtn.innerText = '১০ টাকা পাঠিয়েছি, অফ করুন ⚡';
                confirmBtn.disabled = false;

                // স্ক্রিন আবার সম্পূর্ণ কালো করা
                screen.style.backgroundColor = '#000000';
                screen.style.color = '#ffffff';
                icon.innerText = '🌑';
                statusText.innerText = '১০ টাকা পাওয়া গেছে। লাইট অফ করা হলো!';

                // আবার অন বাটন ফেরত আনা
                offBtn.style.display = 'none';
                onBtn.style.display = 'inline-block';

                // ফুলস্ক্রিন ও ওয়েক-লক রিলিজ
                if (document.exitFullscreen && document.fullscreenElement) {
                    document.exitFullscreen().catch(() => {});
                }
                if (wakeLock !== null) {
                    wakeLock.release();
                    wakeLock = null;
                }
            }, 1000);
        }
    </script>
</body>
</html>
