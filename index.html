<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আল্ট্রা প্রো ম্যাক্স ফ্লাশলাইট</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.4s ease;
            overflow: hidden;
        }

        /* ফ্লাশলাইট অন (উজ্জ্বল সাদা) */
        .light-on {
            background-color: #ffffff;
            color: #111;
        }

        /* ফ্লাশলাইট অফ (ডার্ক) */
        .light-off {
            background-color: #0d0d0d;
            color: #eee;
        }

        .container {
            text-align: center;
        }

        .icon {
            font-size: 85px;
            margin-bottom: 25px;
            animation: glow 1.2s infinite alternate;
        }

        @keyframes glow {
            from { transform: scale(1); filter: drop-shadow(0 0 12px #ffd600); }
            to { transform: scale(1.08); filter: drop-shadow(0 0 30px #ffab00); }
        }

        .btn-off {
            padding: 16px 40px;
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(135deg, #e53935, #c62828);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(229, 57, 53, 0.4);
            transition: transform 0.2s;
        }

        .btn-off:active {
            transform: scale(0.95);
        }

        /* সাবস্ক্রিপশন মডাল */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            z-index: 999;
            padding: 20px;
        }

        .modal-box {
            background: #ffffff;
            color: #222;
            padding: 28px 24px;
            border-radius: 24px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            animation: popUp 0.25s ease-out;
        }

        @keyframes popUp {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-box h2 {
            font-size: 22px;
            color: #d32f2f;
            margin-bottom: 8px;
        }

        .modal-box p {
            font-size: 14px;
            color: #555;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        /* মেথড ব্যাজ */
        .methods {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .badge {
            font-size: 12px;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 6px;
            color: white;
        }

        .bkash { background-color: #e2136e; }
        .nagad { background-color: #f7941d; }
        .upay  { background-color: #005a9c; }

        /* নম্বর বক্স */
        .number-box {
            background: #f8f9fa;
            border: 2px dashed #b0bec5;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .number-text {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #263238;
        }

        .copy-btn {
            background: #37474f;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        .copy-btn:hover {
            background: #212121;
        }

        .trx-input {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            border: 1px solid #cfd8dc;
            border-radius: 10px;
            margin-bottom: 14px;
            text-align: center;
            outline: none;
        }

        .trx-input:focus {
            border-color: #00c853;
        }

        .btn-confirm {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: #00c853;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 10px;
            box-shadow: 0 4px 12px rgba(0, 200, 83, 0.3);
        }

        .btn-cancel {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            color: #78909c;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        /* অফ স্ক্রিন টেক্সট */
        .off-status {
            display: none;
            text-align: center;
        }

        .off-status h1 {
            font-size: 26px;
            margin-bottom: 10px;
        }

        .off-status p {
            color: #9e9e9e;
            font-size: 15px;
        }
    </style>
</head>
<body class="light-on" id="screen">

    <!-- মেইন অন ইন্টারফেস -->
    <div class="container" id="mainUI">
        <div class="icon">🔦</div>
        <button class="btn-off" onclick="openPaymentModal()">লাইট অফ করুন</button>
    </div>

    <!-- অফ হওয়ার পর স্ক্রিন -->
    <div class="off-status" id="offStatus">
        <h1>😴 ফ্লাশলাইট অফ হয়েছে!</h1>
        <p>১০ টাকা পেমেন্ট যাচাই করা হয়েছে। ধন্যবাদ!</p>
        <button onclick="location.reload()" style="margin-top: 25px; padding: 10px 22px; border-radius: 20px; border: 1px solid #555; background: transparent; color: #aaa; cursor: pointer;">আবার জ্বালান 💡</button>
    </div>

    <!-- পেমেন্ট পপ-আপ -->
    <div class="modal-overlay" id="payModal">
        <div class="modal-box">
            <h2>⚠️ লাইট অফ সাবস্ক্রিপশন!</h2>
            <p>ফ্রি ট্রায়াল শেষ! লাইট অফ করতে নিচের নম্বরে <strong>১০ টাকা সেন্ড মানি</strong> করুন।</p>

            <!-- মেথডস -->
            <div class="methods">
                <span class="badge bkash">বিকাশ</span>
                <span class="badge nagad">নগদ</span>
                <span class="badge upay">উপায়</span>
            </div>

            <!-- নম্বর বক্স -->
            <div class="number-box">
                <span class="number-text" id="phoneNum">01932084441</span>
                <button class="copy-btn" id="copyBtn" onclick="copyNumber()">কপি</button>
            </div>

            <input type="text" id="trxInput" class="trx-input" placeholder="TrxID বা আপনার নম্বর লিখুন">

            <button class="btn-confirm" id="confirmBtn" onclick="verifyAndTurnOff()">টাকা পাঠিয়েছি, লাইট অফ করুন ⚡</button>
            <button class="btn-cancel" onclick="refusePayment()">টাকা দেব না, লাইট জ্বলতেই থাকুক 🥲</button>
        </div>
    </div>

    <script>
        const modal = document.getElementById('payModal');
        const screen = document.getElementById('screen');
        const mainUI = document.getElementById('mainUI');
        const offStatus = document.getElementById('offStatus');
        const copyBtn = document.getElementById('copyBtn');
        const confirmBtn = document.getElementById('confirmBtn');

        // পেমেন্ট মডাল খোলা
        function openPaymentModal() {
            modal.style.display = 'flex';
        }

        // নম্বর কপি ফাংশন
        function copyNumber() {
            const num = document.getElementById('phoneNum').innerText;
            navigator.clipboard.writeText(num).then(() => {
                copyBtn.innerText = 'কপি হয়েছে!';
                copyBtn.style.background = '#00c853';
                setTimeout(() => {
                    copyBtn.innerText = 'কপি';
                    copyBtn.style.background = '#37474f';
                }, 2000);
            });
        }

        // টাকা দিতে না চাইলে
        function refusePayment() {
            modal.style.display = 'none';
            alert('টাকা ছাড়া লাইট অফ করা অসম্ভব! জ্বলতেই থাকবে 🔥');
        }

        // পেমেন্ট ভেরিফিকেশন ও লাইট অফ
        function verifyAndTurnOff() {
            confirmBtn.innerText = 'যাচাই করা হচ্ছে... ⏳';
            confirmBtn.disabled = true;

            setTimeout(() => {
                modal.style.display = 'none';
                mainUI.style.display = 'none';

                // ব্যাকগ্রাউন্ড ডার্ক করা
                screen.classList.remove('light-on');
                screen.classList.add('light-off');

                offStatus.style.display = 'block';
            }, 1200);
        }
    </script>
</body>
</html>
